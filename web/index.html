<title>Enigmo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
  :root {
    --bg: #0D121F; --bg2: #070A12; --panel: #171C2E; --panel2: #1F2540; --line: rgba(255,255,255,.12);
    --text: #F2F5FF; --muted: rgba(242,245,255,.55); --dim: rgba(242,245,255,.32);
    --gold: #FFD966; --gold-ink: #2A2000; --accent: #5A8CFF; --danger: #FF6E66;
    --water: #4DADFF; --oil: #C7B24D; --lava: #FF6629;
    --font: 'Nunito', 'SF Pro Rounded', ui-rounded, system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg2); color: var(--text); font-family: var(--font); font-weight: 700;
         -webkit-font-smoothing: antialiased; overflow: hidden; touch-action: manipulation; }
  * { box-sizing: border-box; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  #app { height: 100%; display: flex; align-items: center; justify-content: center; padding: 0 16px; }
  #stage { position: relative; background: var(--bg); border-radius: 0; overflow: hidden; }
  @media (min-width: 520px) { #stage { border-radius: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px var(--line); } }
  canvas { display: block; touch-action: none; }

  #stage { --s: 1; }
  .overlay { position: absolute; left: 0; top: 0; width: 402px; height: 781px; transform: scale(var(--s)); transform-origin: 0 0; display: flex; flex-direction: column; }
  .ui { pointer-events: none; }
  .ui > * { pointer-events: auto; }

  /* HUD */
  #hud { justify-content: flex-start; }
  #hudbar { display: flex; align-items: center; gap: 8px; padding: 0 10px; height: 62px; }
  .round { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.10); display: grid; place-items: center; flex: 0 0 auto; }
  .round svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .eyebrow { font-size: 10px; font-weight: 900; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
  .hudcell { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .hudcell.name { flex: 1; }
  .hudcell.r { align-items: flex-end; text-align: right; }
  .hudval { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #time.warn { color: var(--gold); } #time.late { color: var(--danger); }
  .spacer { flex: 1; min-width: 4px; }
  /* Guidance strip: sits just above the tray, never blocks touches, never covers the top of the playfield. */
  #msg { position: absolute; left: 12px; right: 12px; bottom: 100px; display: flex; gap: 10px; align-items: center; padding: 10px 12px;
         background: rgba(23,28,46,.94); border: 1px solid var(--line); border-radius: 14px; font-size: 13px; font-weight: 700; line-height: 1.35;
         pointer-events: none; opacity: 0; transition: opacity .35s; }
  #msg.show { opacity: 1; }
  #msg.tut { border-color: rgba(255,217,102,.6); }
  #msg .ico { width: 24px; flex: 0 0 auto; color: var(--gold); font-size: 18px; text-align: center; }
  #msg .tx { flex: 1; min-width: 0; }
  #msg .step { color: var(--dim); font-size: 11px; font-weight: 900; flex: 0 0 auto; }
  #msg .step:empty { display: none; }

  /* Menu */
  #menu { background: linear-gradient(var(--bg), var(--bg2)); overflow: hidden; }
  #menu .top { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 0; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: rgba(255,255,255,.08); font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .pill .star { color: var(--gold); }
  h1 { margin: 4px 0 6px; text-align: center; font-size: 52px; font-weight: 900; letter-spacing: .02em; line-height: 1;
       background: linear-gradient(#8CD9FF, #5A73FF); -webkit-background-clip: text; background-clip: text; color: transparent;
       filter: drop-shadow(0 0 18px rgba(77,153,255,.45)); }
  #menu .scroll { flex: 1; overflow-y: auto; padding-bottom: 120px; }
  .chips { display: flex; gap: 8px; padding: 6px 16px 14px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; display: inline-flex; gap: 6px; align-items: center; padding: 9px 14px; border-radius: 999px; background: rgba(255,255,255,.08); font-size: 13px; font-weight: 800; color: rgba(242,245,255,.85); }
  .chip.locked { color: var(--dim); }
  .chip.on { background: var(--gold); color: var(--gold-ink); }
  .chapter { padding: 0 18px 12px; }
  .chapter h2 { margin: 2px 0 0; font-size: 22px; font-weight: 900; }
  .chapter p { margin: 3px 0 0; font-size: 13px; color: var(--muted); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 16px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 12px 6px; border-radius: 14px; background: rgba(255,255,255,.10); border: 1px solid var(--line); text-align: center; }
  .tile.next { border-color: rgba(255,217,102,.7); background: rgba(255,255,255,.14); }
  .tile.locked { background: rgba(255,255,255,.04); color: var(--dim); }
  .tile .num { font-size: 24px; font-weight: 900; line-height: 29px; }
  .tile .name { font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .stars { display: inline-flex; gap: 3px; }
  .stars i { display: inline-block; width: 10px; height: 10px; background: currentColor; color: rgba(255,255,255,.18);
             clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
  .stars i.on { color: var(--gold); }
  .lockbox { margin: 0 16px; padding: 28px 24px; border-radius: 18px; background: rgba(255,255,255,.05); text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .lockbox .big { font-size: 28px; color: var(--gold); }
  .lockbox .t { font-size: 16px; font-weight: 800; }
  .lockbox .d { font-size: 13px; color: var(--muted); font-weight: 600; }
  .bar { width: 70%; height: 6px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--gold); }
  .legend { display: flex; justify-content: center; gap: 22px; padding-top: 18px; font-size: 12px; color: rgba(242,245,255,.7); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; box-shadow: 0 0 6px currentColor; }
  .note { margin: 10px 32px 0; text-align: center; font-size: 12px; color: var(--muted); font-weight: 600; line-height: 1.45; }
  #continue { position: absolute; left: 16px; right: 16px; bottom: 10px; display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-radius: 16px; background: var(--gold); color: var(--gold-ink); box-shadow: 0 10px 30px rgba(255,217,102,.3); text-align: left; }
  #continue .eyebrow { color: rgba(42,32,0,.6); }
  #continue .lvl { font-size: 16px; font-weight: 800; }

  /* Win */
  #win { align-items: center; justify-content: center; background: rgba(0,0,0,.6); padding: 20px; }
  .card { width: 100%; max-width: 360px; padding: 24px; border-radius: 24px; background: var(--panel); border: 1px solid rgba(255,255,255,.15); display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
  .card h3 { margin: 0; font-size: 28px; font-weight: 900; background: linear-gradient(#8CD9FF, #5A73FF); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .card .msg { font-size: 14px; color: rgba(242,245,255,.75); font-weight: 600; line-height: 1.4; }
  .bigstars { display: flex; gap: 8px; padding: 4px 0; }
  .bigstars i { width: 34px; height: 34px; background: rgba(255,255,255,.18); clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); transform: scale(.6); transition: transform .35s cubic-bezier(.34,1.56,.64,1), background .2s; }
  .bigstars i.on { background: var(--gold); transform: scale(1); }
  .statrow { display: flex; width: 100%; padding: 6px 0; }
  .stat { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .stat .v { font-size: 20px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .stat .s { font-size: 10px; font-weight: 700; color: var(--dim); }
  .stat.best .v, .stat.best .s { color: var(--gold); }
  .btns { display: flex; gap: 12px; width: 100%; }
  .btn { flex: 1; padding: 13px 8px; border-radius: 13px; background: rgba(255,255,255,.12); font-size: 15px; font-weight: 800; }
  .btn.primary { background: var(--accent); }

  /* Sheets */
  #sheet { justify-content: flex-end; background: rgba(0,0,0,.5); }
  .panel { max-height: 88%; background: var(--bg); border-radius: 22px 22px 0 0; display: flex; flex-direction: column; }
  .panel .head { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 8px; }
  .panel .head b { font-size: 17px; font-weight: 800; }
  .panel .done { padding: 8px 16px; border-radius: 999px; background: rgba(255,255,255,.1); font-weight: 800; }
  .panel .body { overflow-y: auto; padding: 0 16px 24px; display: flex; flex-direction: column; gap: 14px; }
  .statstrip { display: flex; padding: 8px 0; }
  .statstrip .stat { align-items: center; }
  .sec { font-size: 13px; font-weight: 800; color: var(--muted); padding: 4px 4px 0; }
  .list { border-radius: 16px; background: var(--panel); overflow: hidden; }
  .row { display: flex; gap: 14px; align-items: center; padding: 12px 14px; border-top: 1px solid rgba(255,255,255,.06); }
  .row:first-child { border-top: 0; }
  .row .ico { width: 40px; height: 40px; border-radius: 10px; background: rgba(255,255,255,.05); display: grid; place-items: center; font-size: 18px; color: var(--dim); flex: 0 0 auto; }
  .row.on .ico { background: rgba(255,255,255,.12); color: var(--gold); }
  .row .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .row .t { font-size: 15px; font-weight: 800; color: rgba(242,245,255,.6); }
  .row.on .t { color: var(--text); }
  .row .d { font-size: 12px; font-weight: 600; color: var(--muted); }
  .row .when { font-size: 10px; font-weight: 800; color: rgba(255,217,102,.8); }
  .row .check { color: var(--gold); font-size: 18px; }
  .row.toggle { justify-content: space-between; }
  .switch { width: 50px; height: 30px; border-radius: 15px; background: rgba(255,255,255,.15); position: relative; transition: background .2s; flex: 0 0 auto; }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .switch.on { background: var(--gold); } .switch.on::after { transform: translateX(20px); }
  .row.action .t { color: var(--gold); } .row.action.danger .t { color: var(--danger); }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; }
  .confirm { padding: 14px; border-radius: 16px; background: var(--panel2); display: flex; flex-direction: column; gap: 10px; }
  .confirm .btn { flex: 1; }
  .about { font-size: 12px; color: var(--dim); font-weight: 600; text-align: center; line-height: 1.5; padding: 6px 0 0; }

  /* Toast */
  #toastLayer { pointer-events: none; }
  #toast { position: absolute; left: 16px; right: 16px; top: 8px; pointer-events: auto; display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 16px; background: var(--panel); border: 1px solid rgba(255,217,102,.6); box-shadow: 0 16px 40px rgba(0,0,0,.5); z-index: 5; transform: translateY(-140%); transition: transform .4s cubic-bezier(.2,1.2,.4,1); }
  #toast.show { transform: none; }
  #toast .ico { width: 38px; height: 38px; border-radius: 10px; background: rgba(255,255,255,.12); display: grid; place-items: center; color: var(--gold); font-size: 18px; }
  #toast .k { font-size: 9px; font-weight: 900; letter-spacing: .08em; color: var(--gold); }
  #toast .t { font-size: 15px; font-weight: 800; } #toast .d { font-size: 11px; color: var(--muted); font-weight: 600; }
  @media (prefers-reduced-motion: reduce) { #toast, .bigstars i { transition: none; } }
</style>

<div id="app">
  <div id="stage">
    <canvas id="game" aria-label="Enigmo playfield"></canvas>

    <div id="hud" class="overlay ui" hidden>
      <div id="hudbar">
        <button class="round" id="btnBack" aria-label="Back to menu"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="hudcell name"><span class="eyebrow" id="lvlno">Level 1</span><span class="hudval" id="lvlname">First Drop</span></div>
        <div class="hudcell r"><span class="eyebrow" id="parlbl">Par 0:30</span><span class="hudval" id="time">0:00</span></div>
        <div class="hudcell r"><span class="eyebrow">Drops</span><span class="hudval" id="drops">0/40</span></div>
        <button class="round" id="btnHint" aria-label="Show hint"><svg viewBox="0 0 24 24"><path d="M9 21h6"/><path d="M12 3a6 6 0 0 0-4 10.5c.8.7 1 1.3 1 2.5h6c0-1.2.2-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg></button>
        <button class="round" id="btnReset" aria-label="Reset level"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></svg></button>
      </div>
      <div id="msg"><span class="ico"></span><span class="tx"></span><span class="step"></span></div>
    </div>

    <div id="menu" class="overlay">
      <div class="top">
        <button class="round" id="btnAch" aria-label="Achievements">🏆</button>
        <span class="pill"><span class="star">★</span><span id="starTotal">0 / 72</span></span>
        <button class="round" id="btnSet" aria-label="Settings">⚙</button>
      </div>
      <h1>ENIGMO</h1>
      <div class="scroll">
        <div class="chips" id="chips"></div>
        <div id="chapter"></div>
        <div class="legend">
          <span><i style="color:var(--water);background:var(--water)"></i>Water</span>
          <span><i style="color:var(--oil);background:var(--oil)"></i>Oil</span>
          <span><i style="color:var(--lava);background:var(--lava)"></i>Lava</span>
        </div>
        <p class="note">Each bucket takes one liquid. A wrong droplet costs you one you've already caught. Drag parts from the tray, tap one and drag its knob to rotate it, drag it back to the tray to return it.</p>
      </div>
      <button id="continue"><span><span class="eyebrow" id="contK">Start</span><br><span class="lvl" id="contL">Level 1 · First Drop</span></span><span>▶</span></button>
    </div>

    <div id="win" class="overlay" hidden></div>
    <div id="sheet" class="overlay" hidden></div>
    <div id="toastLayer" class="overlay"><div id="toast" aria-live="polite"><span class="ico">★</span><span class="tx"><span class="k">ACHIEVEMENT UNLOCKED</span><br><span class="t"></span><br><span class="d"></span></span></div></div>
  </div>
</div>

<script>
(() => {
'use strict';

// ---------- Data ----------
const KIND = { water: { color: '#4DADFF', light: '#B3E0FF', name: 'Water' }, oil: { color: '#C7B24D', light: '#F2E699', name: 'Oil' }, lava: { color: '#FF6629', light: '#FFC78C', name: 'Lava' } };
const TOOL = {
  bumper: { title: 'Bumper', w: 78, h: 12, color: '#7854FF', stroke: '#C7B8FF', blurb: 'Bouncy. Droplets rebound at full speed.' },
  slider: { title: 'Slider', w: 92, h: 8, color: '#9ED9E0', stroke: '#E6FAFF', blurb: 'Slick. Droplets glide along it.' },
  sponge: { title: 'Sponge', w: 66, h: 16, color: '#F5C842', stroke: '#FFE68C', blurb: 'Soaks up any droplet that touches it.' },
  accelerator: { title: 'Accel', w: 44, h: 44, color: '#FF8C33', stroke: '#FFD9A6', blurb: 'Fires droplets along its arrow.' },
  gravity: { title: 'Gravity', w: 40, h: 40, color: '#D973FF', stroke: '#FFFFFF', blurb: 'Pulls nearby droplets toward it.' },
};
const TOOL_ORDER = ['bumper', 'slider', 'sponge', 'accelerator', 'gravity'];
const CHAPTERS = [
  { id: 0, name: 'First Drops', tagline: 'Learn the parts. Fill the buckets.', stars: 0, from: 0, to: 6 },
  { id: 1, name: 'Mixing It Up', tagline: 'Two liquids, tighter spaces, new tricks.', stars: 8, from: 6, to: 12 },
  { id: 2, name: 'Under Pressure', tagline: 'Funnels, roofs, and three streams at once.', stars: 20, from: 12, to: 18 },
  { id: 3, name: 'Master Plumber', tagline: 'Everything you know, all at once.', stars: 36, from: 18, to: 24 },
];
// D = dropper [x, y, angleDeg, speed, kind], C = container [x, y, kind], W = wall [x, y, w, h]
const LEVELS = [
  { name: 'First Drop', hint: 'Drag a Slider under the stream, then tilt it toward the bucket.', D: [[.22,.93,-90,40,'water']], C: [[.78,.04,'water']], W: [], tools: { slider: 2, bumper: 1 }, target: 40, par: 30 },
  { name: 'Over the Wall', hint: 'Bumpers bounce droplets back at full speed. A tiny tilt goes a long way.', D: [[.16,.93,-90,40,'water']], C: [[.80,.04,'water']], W: [[.48,0,.04,.52]], tools: { bumper: 2, slider: 1 }, target: 40, par: 35 },
  { name: 'Up and Over', hint: 'The bucket sits on a ledge. Bounce the stream up to it.', D: [[.40,.95,-90,40,'water']], C: [[.85,.50,'water']], W: [[.70,.44,.30,.06]], tools: { bumper: 2, slider: 2 }, target: 40, par: 45 },
  { name: 'Staircase', hint: 'Droplets that stop moving evaporate. Keep the stream flowing.', D: [[.10,.93,-90,40,'water']], C: [[.86,.04,'water']], W: [[0,.62,.28,.03],[.36,.40,.28,.03]], tools: { slider: 3, bumper: 1 }, target: 40, par: 45 },
  { name: 'Sponge Bath', hint: 'Wrong liquids poison a bucket. Sponge the oil before it gets there.', D: [[.32,.93,-90,40,'water'],[.52,.93,-90,40,'oil']], C: [[.50,.04,'water']], W: [[0,0,.22,.30]], tools: { sponge: 2, slider: 2, bumper: 1 }, target: 40, par: 50 },
  { name: 'Lava Lamp', hint: 'Accelerators fling droplets in the direction of the arrow.', D: [[.08,.55,0,180,'lava']], C: [[.88,.04,'lava']], W: [[.60,.30,.40,.05],[.30,0,.05,.22]], tools: { slider: 2, accelerator: 1, bumper: 1 }, target: 40, par: 50 },
  { name: 'Oil and Water', hint: 'Cross the streams. Each bucket takes only its own liquid.', D: [[.15,.93,-90,40,'water'],[.85,.93,-90,40,'oil']], C: [[.70,.04,'water'],[.30,.04,'oil']], W: [[.48,0,.04,.40]], tools: { bumper: 2, slider: 3, sponge: 1 }, target: 25, par: 70 },
  { name: 'Crossfire', hint: 'Two jets, two buckets. Sliders can catch a fast stream.', D: [[.06,.62,0,230,'water'],[.94,.62,180,230,'lava']], C: [[.84,.04,'water'],[.16,.04,'lava']], W: [[.47,0,.06,.32]], tools: { bumper: 3, slider: 2, sponge: 1, accelerator: 1 }, target: 30, par: 70 },
  { name: 'Fountain', hint: 'This one shoots up. Catch it on the way down.', D: [[.50,.06,90,470,'oil']], C: [[.15,.58,'oil']], W: [[0,.52,.30,.06]], tools: { bumper: 2, slider: 2, accelerator: 1, sponge: 1 }, target: 40, par: 60 },
  { name: 'Pull of Gravity', hint: 'A Gravity Well bends the stream toward it. Place it beside the flow, not in it.', D: [[.28,.93,-90,40,'water']], C: [[.80,.04,'water']], W: [[.40,0,.04,.18]], tools: { gravity: 1, slider: 1 }, target: 40, par: 50 },
  { name: 'The Gauntlet', hint: 'Thread the needle. Every gap is wider than it looks.', D: [[.50,.95,-90,40,'water']], C: [[.50,.04,'water']], W: [[.30,.70,.40,.03],[0,.45,.36,.03],[.64,.45,.36,.03],[.34,.22,.32,.03]], tools: { bumper: 2, slider: 3, accelerator: 1 }, target: 40, par: 70 },
  { name: 'Split Decision', hint: 'One stream, two buckets. Catch the edge of the stream to split it.', D: [[.50,.93,-90,40,'water']], C: [[.14,.04,'water'],[.86,.04,'water']], W: [[.48,0,.04,.30]], tools: { bumper: 2, slider: 3 }, target: 20, par: 80 },

  { name: 'Triple Threat', hint: 'Three streams, three buckets, all shuffled. Work one liquid at a time.', D: [[.20,.93,-90,40,'water'],[.50,.93,-90,40,'oil'],[.80,.93,-90,40,'lava']], C: [[.20,.04,'lava'],[.50,.04,'water'],[.80,.04,'oil']], W: [], tools: { slider: 4, bumper: 3, sponge: 1 }, target: 20, par: 110 },
  { name: 'Under the Roof', hint: 'The bucket is covered. Come in low and from the side.', D: [[.20,.93,-90,40,'water']], C: [[.82,.04,'water']], W: [[.62,.22,.38,.04]], tools: { accelerator: 1, slider: 2, bumper: 1 }, target: 40, par: 70 },
  { name: 'Sideways', hint: 'Only water belongs in this bucket. Clear the oil out of the lane.', D: [[.05,.85,0,260,'water'],[.95,.70,180,260,'oil']], C: [[.88,.04,'water']], W: [], tools: { sponge: 2, slider: 2, bumper: 1 }, target: 40, par: 70 },

Sound.enabled = model.progress.soundOn;

// ---------- Rendering ----------
const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');

let scale = 1;

  stage.style.width = w + 'px'; stage.style.height = hgt + 'px';

}
window.addEventListener('resize', resize); resize();

function sprite(kind) {

function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

function draw() {

  for (let x = 0; x <= LW; x += 36) { ctx.moveTo(x, PLAY.y); ctx.lineTo(x, PLAY.bottom); }

    if (t === scene.selected) { rrect(-t.w / 2 - 7, -t.h / 2 - 7, t.w + 14, t.h + 14, 10); ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillRect(-.75, -t.h / 2 - 20, 1.5, 20); ctx.beginPath(); ctx.arc(0, -t.h / 2 - 28, 9, 0, 7); ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); }

let last = performance.now();

// input
let pid = null;

document.addEventListener('pointerdown', () => Sound.unlock(), { once: true });

// ---------- UI ----------
const $ = id => document.getElementById(id);
const ui = {
  msgTimer: null,
  message(kind, text, ico, step, ms) {
    const m = $('msg'); clearTimeout(this.msgTimer);
    m.querySelector('.ico').textContent = ico; m.querySelector('.tx').textContent = text; m.querySelector('.step').textContent = step || '';

  hideMessage() { clearTimeout(this.msgTimer); $('msg').classList.remove('show'); },

  drops() { $('drops').textContent = `${model.collected}/${model.level.total}`; },
  tutorial() {

  renderMenu() {

})();
